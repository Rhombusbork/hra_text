# 윈도우 배포판 빌드: HRA_Tool.zip (Python·작은 Java·hwp2hwpx 포함, 설치 불필요)
# 결과는 Actions 실행 화면의 Artifacts 에서 받는다. (자동 공개 배포는 하지 않음)
name: windows-build

on:
  workflow_dispatch:
  push:
    branches: [hwpx-xml]
    paths: ["hra_text/**", "packaging/**", "scripts/**", "tools/**", "tests/**", "pyproject.toml", ".gitattributes", ".github/workflows/windows-build.yml"]

# 새로 올리면 진행 중이던 빌드는 취소
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: hwp2hwpx 빌드
        run: ./scripts/build_hwp2hwpx.sh
      - name: 테스트
        run: |
          python -m pip install -q -e . pytest
          HRA_NO_DIALOG=1 python -m pytest -q -p no:cacheprovider
      - name: 작은 Java 만들기 (jlink)
        run: jlink --add-modules java.base,java.xml --strip-debug --no-man-pages --no-header-files --compress=zip-6 --output runtime
      - name: exe 만들기 (PyInstaller)
        run: |
          python -m pip install -q pyinstaller
          python -m PyInstaller --noconfirm --windowed --name HRA_Tool \
            --collect-submodules hra_text \
            --add-data "vendor/hwp2hwpx-cli.jar;vendor" \
            --add-data "hra_text/rules/spacing_dict.tsv;hra_text/rules" \
            packaging/hra_tool.py
          cp -r runtime dist/HRA_Tool/runtime
          cp docs/사용법.md dist/HRA_Tool/사용법.md
      - name: 배포판 점검 (exe 로 합성 문서 고치기)
        timeout-minutes: 8
        run: |
          python -c "import sys; sys.path.insert(0,'tests'); import conftest, pathlib; conftest.build_hwpx(pathlib.Path('smoke.hwpx'))"
          export HRA_NO_DIALOG=1 HRA_ERROR_LOG="$PWD/exe_error.log"
          set +e
          timeout 300 ./dist/HRA_Tool/HRA_Tool.exe smoke.hwpx
          code=$?
          set -e
          echo "exe 종료 코드: $code"
          # 오류 내용은 로그인 없이도 보이는 '알림(annotation)'으로 남긴다
          if [ -f exe_error.log ]; then tail -n 15 exe_error.log | while IFS= read -r line; do echo "::error::exe $line"; done; fi
          if [ "$code" = "124" ]; then echo "::error::exe 가 5분 안에 끝나지 않음 (멈춤)"; fi
          ls -la . 결과 || true
          for f in 결과/smoke_피드백.hwpx 결과/smoke_수정본.hwpx 결과/smoke_변경내역.txt; do
            test -f "$f" || { echo "::error::결과 파일이 없음: $f (종료 코드 $code)"; exit 1; }
          done
          echo "::notice::exe 점검 통과 — smoke_피드백.hwpx·smoke_수정본.hwpx·smoke_변경내역.txt 생성"
      - uses: actions/upload-artifact@v4
        with:
          name: HRA_Tool
          path: dist/HRA_Tool
