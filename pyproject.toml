[project]
name = "hra-text"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = ["lxml>=5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hra-fix = "hra_text.cli:main"

[tool.setuptools.dynamic]
version = { attr = "hra_text.__version__" }

[tool.setuptools.packages.find]
include = ["hra_text*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
